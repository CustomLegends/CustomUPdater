name: Build CustomUpdater

on:
  push:
  workflow_dispatch:

# Needed so the "Publish release" step may create/update the release with GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    steps:
    - uses: actions/checkout@v1

    - name: Get submodules (borealis, TegraExplorer)
      run: |
        # 1) The checkout lives in /__w/<repo>/<repo> and is owned by another user than the
        #    container user -> git refuses it ("dubious ownership"). Trust every directory
        #    (works for any repo name, no hard-coded paths).
        git config --global --add safe.directory '*'

        # 2) Normal case: the repo knows its submodules (e.g. a GitHub fork).
        git submodule sync --recursive || true
        git submodule update --init --recursive || true

        # 3) Fallback: files were uploaded without submodule entries -> the folders are
        #    empty. Clone them straight from GitHub (public repos, no token needed),
        #    pinned to the versions this app was written against.
        fetch() {
          dir="$1"; url="$2"; sha="$3"
          if [ -z "$(ls -A "$dir" 2>/dev/null)" ]; then
            echo "::notice::$dir is empty -> cloning $url"
            rm -rf "$dir"
            git clone --recursive "$url" "$dir"
            git -C "$dir" checkout "$sha"
            git -C "$dir" submodule update --init --recursive
          fi
        }
        fetch lib/borealis https://github.com/HamletDuFromage/borealis 25651d2ac7ecda88319d322383726a64ea22d3c8
        fetch TegraExplorer https://github.com/HamletDuFromage/TegraExplorer 26f992d378697a406610004d3079a4b3463ed68f

        test -f lib/borealis/library/include/borealis.hpp || { echo "::error::borealis is missing"; exit 1; }
        test -d TegraExplorer || { echo "::error::TegraExplorer is missing"; exit 1; }

    - name: install dependencies
      run: |
        dkp-pacman -S --needed --noconfirm switch-curl switch-zlib switch-mbedtls

    - name: Building CustomUpdater
      run: |
        make -C aiosu-forwarder -f Makefile
        make -j$(nproc)
        # The app expects the file to be called CustomUpdater.nro, whatever the repo is named.
        NRO="$(ls -1 *.nro | head -n 1)"
        if [ "$NRO" != "CustomUpdater.nro" ]; then mv "$NRO" CustomUpdater.nro; fi
        ls -la *.nro

    - uses: actions/upload-artifact@v4
      with:
        name: CustomUpdater
        path: CustomUpdater.nro

    - name: Create zip for release
      run: zip CustomUpdater.zip CustomUpdater.nro

    - name: Read version from Makefile
      id: version
      run: echo "version=$(grep 'APP_VERSION' Makefile | head -1 | awk '{print $NF}')" >> $GITHUB_OUTPUT

    # Published as the PRE-release tagged "app", so it never becomes the repo's "latest"
    # release (those are your CFW packs). Only on main/master.
    - name: Publish release
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: app
        target_commitish: ${{ github.sha }}
        name: CustomUpdater (app) ${{ steps.version.outputs.version }}
        files: |
          CustomUpdater.zip
          CustomUpdater.nro
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
